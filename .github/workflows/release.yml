name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      dry_run:
        description: Preview the version and changelog without pushing or creating a release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Prepare and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - name: Require the main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != refs/heads/main ]]; then
            echo 'Run the Release workflow on main.' >&2
            exit 1
          fi

      - name: Check out main and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate commit messages and unreleased changes
        run: |
          BASE_SHA=$(cat .github/commitlint-base)
          npm run commitlint -- --from "$BASE_SHA" --to HEAD --verbose
          CURRENT_VERSION=$(node -p 'require("./package.json").version')
          CURRENT_TAG="v$CURRENT_VERSION"
          if git show-ref --verify --quiet "refs/tags/$CURRENT_TAG"; then
            git merge-base --is-ancestor "$CURRENT_TAG" HEAD
            if [[ $(git rev-list --count "$CURRENT_TAG..HEAD") == 0 ]]; then
              echo "No changes since $CURRENT_TAG." >&2
              exit 1
            fi
          fi

      - name: Bump version and generate changelog
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in patch|minor|major) ;; *) exit 1 ;; esac
          npm run release:prepare -- --release-as "$BUMP"
          npm exec -- prettier --write package.json CHANGELOG.md
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          npm run release:notes -- "$VERSION" "$RUNNER_TEMP/release-notes.md"

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Summarize the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          printf '## Release %s\n\nDry run: `%s`\n\n' "$TAG" "$DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit version and changelog, then push tag atomically
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
