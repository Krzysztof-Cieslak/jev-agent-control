name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (first keeps the current version)
        required: true
        type: choice
        default: patch
        options: [first, patch, minor, major]
      dry_run:
        description: Preview the version, changelog, and npm package without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      HUSKY: "0"
    steps:
      - name: Require the main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != refs/heads/main ]]; then
            echo 'Run the Release workflow on main.' >&2
            exit 1
          fi
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      - name: Check out main and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate commit messages and unreleased changes
        run: |
          BASE_SHA=$(cat .github/commitlint-base)
          npm run commitlint -- --from "$BASE_SHA" --to HEAD --verbose
          CURRENT_VERSION=$(node -p 'require("./package.json").version')
          CURRENT_TAG="v$CURRENT_VERSION"
          if git show-ref --verify --quiet "refs/tags/$CURRENT_TAG"; then
            git merge-base --is-ancestor "$CURRENT_TAG" HEAD
            if [[ $(git rev-list --count "$CURRENT_TAG..HEAD") == 0 ]]; then
              echo "No changes since $CURRENT_TAG." >&2
              exit 1
            fi
          fi

      - name: Bump version and generate changelog
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            first)
              if [[ -n "$(git tag --list 'v[0-9]*')" ]]; then
                echo 'The first-release option is only available before any version tags exist.' >&2
                exit 1
              fi
              npm run release:prepare -- --first-release
              ;;
            patch|minor|major)
              npm run release:prepare -- --release-as "$BUMP"
              ;;
            *) exit 1 ;;
          esac
          npm exec -- prettier --write package.json CHANGELOG.md
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p "$RELEASE_DIR"
          npm run release:notes -- "$VERSION" "$RELEASE_DIR/release-notes.md"

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Commit version and changelog locally
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag -a "$TAG" -m "$TAG"

      - name: Pack and verify release contents
        run: npm run release:pack -- "$RELEASE_DIR"

      - name: Preview npm publication
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: npm run release:preview -- "$RELEASE_DIR"

      - name: Save the verified release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Summarize the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          printf '## Release %s\n\nDry run: `%s`\n\n' "$TAG" "$DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          cat "$RELEASE_DIR/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n### npm package\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RELEASE_DIR/release.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Push release commit and tag atomically
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

  publish:
    name: Publish to npm and GitHub
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      - name: Download the verified release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: ${{ env.RELEASE_DIR }}

      - name: Publish the exact verified tarball
        env:
          # OIDC is preferred; a granular token can bootstrap the first publication.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance is unavailable for this private source repository.
          NPM_CONFIG_PROVENANCE: "false"
        run: node scripts/npm-release.ts publish "$RELEASE_DIR"

      - name: Create or complete the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ARCHIVE=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RELEASE_DIR + "/release.json", "utf8")).filename')
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_DIR/$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$RELEASE_DIR/$ARCHIVE" --verify-tag --title "$TAG" --notes-file "$RELEASE_DIR/release-notes.md"
          fi
